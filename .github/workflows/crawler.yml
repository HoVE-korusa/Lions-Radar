name: Update Lions Radar Data

on:
  schedule:
    - cron: '*/15 * * * *' # 15분마다 자동 실행
  workflow_dispatch:       # 수동 즉시 실행 버튼 활성화

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 크롤러 실행 및 data.json 갱신
        run: python scraper.py

      - name: 변경된 데이터 커밋 & 푸시
        run: |
          git config --global user.name "lions-radar-bot"
          git config --global user.email "bot@noreply.github.com"
          git add public/data.json
          git diff --staged --quiet || git commit -m "chore: update radar data [skip ci]"
          git push
